# NOTE: GitHub auto-disables scheduled workflows after 60 days of repo inactivity.
# Push a commit or manually trigger this workflow to re-enable it.

name: Forward Emails to WhatsApp

on:
  schedule:
    # Pakistan time (UTC+5): 12:00 PM and 12:00 AM
    - cron: "0 7 * * *"   # 12:00 PM PKT
    - cron: "0 19 * * *"  # 12:00 AM PKT
  workflow_dispatch: # Manual trigger for testing

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SENDER_EMAIL_FILTER: ${{ secrets.SENDER_EMAIL_FILTER }}
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          GREEN_API_MEDIA_URL: ${{ secrets.GREEN_API_MEDIA_URL }}
          WHATSAPP_CHAT_ID: ${{ secrets.WHATSAPP_CHAT_ID }}
